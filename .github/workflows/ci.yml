name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy (Admin only)'
        required: false
        default: 'Manual production deploy'
        type: string

jobs:
  filter:
    name: Detect File Changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      unit: ${{ steps.changes.outputs.unit }}
      e2e: ${{ steps.changes.outputs.e2e }}
      app: ${{ steps.changes.outputs.app }}
      meta: ${{ steps.changes.outputs.meta }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            # Project metadata & version changes
            meta:
              - 'package.json'
            # Code & tooling configs that need linting
            code:
              - 'js/**'
              - 'tests/**'
              - '.github/workflows/**'
              - '*.js'
              - '*.json'
            # Changes that affect logic, changelog format, or asset/cache integrity
            unit:
              - 'js/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'
              - 'tests/unit/**'
              - '.github/workflows/**'
              - 'package.json'
            # Changes that affect browser UI, styles, or DOM elements
            e2e:
              - 'js/**'
              - 'css/**'
              - 'index.html'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - '.github/workflows/**'
              - 'package.json'
            # Web app assets deployed to live site (GitHub Pages)
            app:
              - 'index.html'
              - 'js/**'
              - 'css/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'
              - 'package.json'
              - '.github/workflows/**'

  lint:
    name: Code Quality & Lint
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit & Integrity Tests
    needs: filter
    if: needs.filter.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit

  e2e-tests:
    name: E2E Browser Tests
    needs: filter
    if: needs.filter.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npm run test:e2e

  ci-status:
    name: CI Status
    needs: [filter, lint, unit-tests, e2e-tests]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check for job failures
        if: |
          needs.filter.result == 'failure' ||
          needs.filter.result == 'cancelled' ||
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled' ||
          needs.unit-tests.result == 'failure' ||
          needs.unit-tests.result == 'cancelled' ||
          needs.e2e-tests.result == 'failure' ||
          needs.e2e-tests.result == 'cancelled'
        run: |
          echo "❌ One or more required CI checks failed or were cancelled."
          exit 1
      - name: CI Passed
        run: echo "✅ All required CI checks passed successfully!"

  release:
    name: GitHub Release & Auto-Tag
    needs: [filter, ci-status]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.filter.outputs.meta == 'true' &&
      needs.ci-status.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract & Compare Version
        id: version
        run: |
          PREV_VER=$(git show HEAD~1:package.json 2>/dev/null | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { try { console.log(JSON.parse(data).version || ''); } catch { console.log(''); } });" 2>/dev/null || echo "")
          CURR_VER=$(node -p "require('./package.json').version")
          
          echo "Previous version: ${PREV_VER:-none}"
          echo "Current version: ${CURR_VER}"
          
          if [ -n "$PREV_VER" ] && [ "$PREV_VER" = "$CURR_VER" ]; then
            echo "is_bump=false" >> "$GITHUB_OUTPUT"
            echo "Version has not changed ($CURR_VER). Skipping release."
          else
            echo "is_bump=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${CURR_VER}" >> "$GITHUB_OUTPUT"
            echo "version=${CURR_VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if tag exists
        id: check-tag
        if: steps.version.outputs.is_bump == 'true'
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} is new."
          fi

      - name: Create Git Tag and GitHub Release
        if: steps.version.outputs.is_bump == 'true' && steps.check-tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "BullSheet $TAG" \
            --notes-file CHANGELOG.md \
            --latest

  deploy:
    name: Deploy to GitHub Pages
    needs: [filter, ci-status]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
        (
          github.event_name == 'push' &&
          needs.filter.outputs.app == 'true' &&
          needs.ci-status.result == 'success'
        )
      )
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
