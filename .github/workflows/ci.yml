name: CI & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy (Admin only)'
        required: false
        default: 'Manual production deploy'
        type: string

jobs:
  filter:
    name: Detect File Changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      unit: ${{ steps.changes.outputs.unit }}
      e2e: ${{ steps.changes.outputs.e2e }}
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            # Code & tooling configs that need linting
            code:
              - 'js/**'
              - 'tests/**'
              - '.github/workflows/**'
              - '*.js'
              - '*.json'
            # Changes that affect logic, changelog format, or asset/cache integrity
            unit:
              - 'js/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'
              - 'tests/unit/**'
              - '.github/workflows/**'
              - 'package.json'
            # Changes that affect browser UI, styles, or DOM elements
            e2e:
              - 'js/**'
              - 'css/**'
              - 'index.html'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - '.github/workflows/**'
              - 'package.json'
            # Web app assets deployed to live site (GitHub Pages)
            app:
              - 'index.html'
              - 'js/**'
              - 'css/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'

  lint:
    name: Code Quality & Lint
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit & Integrity Tests
    needs: filter
    if: needs.filter.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit

  e2e-tests:
    name: E2E Browser Tests
    needs: filter
    if: needs.filter.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  ci-status:
    name: CI Status
    needs: [filter, lint, unit-tests, e2e-tests]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check for job failures
        if: |
          needs.filter.result == 'failure' ||
          needs.filter.result == 'cancelled' ||
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled' ||
          needs.unit-tests.result == 'failure' ||
          needs.unit-tests.result == 'cancelled' ||
          needs.e2e-tests.result == 'failure' ||
          needs.e2e-tests.result == 'cancelled'
        run: |
          echo "❌ One or more required CI checks failed or were cancelled."
          exit 1
      - name: CI Passed
        run: echo "✅ All required CI checks passed successfully!"

  deploy:
    name: Deploy to GitHub Pages
    needs: [filter, ci-status]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
        (
          github.event_name == 'push' &&
          needs.filter.outputs.app == 'true' &&
          needs.ci-status.result == 'success'
        )
      )
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
