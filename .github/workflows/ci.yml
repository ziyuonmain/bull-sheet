name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  filter:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      unit: ${{ steps.changes.outputs.unit }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters:
            # Code & tooling configs that need linting
            code:
              - 'js/**'
              - 'tests/**'
              - '*.js'
              - '*.json'
            # Changes that affect logic, changelog format, or asset/cache integrity
            unit:
              - 'js/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'
              - 'tests/unit/**'
              - 'package.json'
            # Changes that affect browser UI, styles, or DOM elements
            e2e:
              - 'js/**'
              - 'css/**'
              - 'index.html'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - 'package.json'

  lint:
    name: Code Quality & Lint
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit & Integrity Tests
    needs: filter
    if: needs.filter.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run test:unit

  e2e-tests:
    name: E2E Browser Tests
    needs: filter
    if: needs.filter.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  ci-status:
    name: CI Status
    needs: [filter, lint, unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks succeeded or were cleanly skipped
        run: |
          echo "Filter result: ${{ needs.filter.result }}"
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Unit tests result: ${{ needs.unit-tests.result }}"
          echo "E2E tests result: ${{ needs.e2e-tests.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "❌ One or more required CI checks failed or were cancelled."
            exit 1
          fi

          echo "✅ All required CI checks passed successfully!"
