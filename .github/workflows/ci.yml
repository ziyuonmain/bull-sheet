name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  filter:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      unit: ${{ steps.changes.outputs.unit }}
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            # Code & tooling configs that need linting
            code:
              - 'js/**'
              - 'tests/**'
              - '.github/workflows/**'
              - '*.js'
              - '*.json'
            # Changes that affect logic, changelog format, or asset/cache integrity
            unit:
              - 'js/**'
              - 'audio/**'
              - 'icons/**'
              - 'sw.js'
              - 'manifest.json'
              - 'CHANGELOG.md'
              - 'tests/unit/**'
              - '.github/workflows/**'
              - 'package.json'
            # Changes that affect browser UI, styles, or DOM elements
            e2e:
              - 'js/**'
              - 'css/**'
              - 'index.html'
              - 'tests/e2e/**'
              - 'playwright.config.js'
              - '.github/workflows/**'
              - 'package.json'

  lint:
    name: Code Quality & Lint
    needs: filter
    if: needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-tests:
    name: Unit & Integrity Tests
    needs: filter
    if: needs.filter.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:unit

  e2e-tests:
    name: E2E Browser Tests
    needs: filter
    if: needs.filter.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

  ci-status:
    name: CI Status
    needs: [filter, lint, unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for job failures
        if: |
          needs.filter.result == 'failure' ||
          needs.filter.result == 'cancelled' ||
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled' ||
          needs.unit-tests.result == 'failure' ||
          needs.unit-tests.result == 'cancelled' ||
          needs.e2e-tests.result == 'failure' ||
          needs.e2e-tests.result == 'cancelled'
        run: |
          echo "❌ One or more required CI checks failed or were cancelled."
          exit 1
      - name: CI Passed
        run: echo "✅ All required CI checks passed successfully!"
