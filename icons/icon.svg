<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2430" />
      <stop offset="100%" stop-color="#0e1117" />
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Disc -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="url(#gold-grad)" stroke-width="12" />
  
  <!-- Outer Darts Double Ring Accent -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="16 8" opacity="0.4" />
  
  <!-- Bull Silhouette Head -->
  <path d="M 170 270 C 170 330 210 380 256 380 C 302 380 342 330 342 270 C 342 240 330 220 310 210 C 290 200 222 200 202 210 C 182 220 170 240 170 270 Z" fill="#12151b" stroke="url(#gold-grad)" stroke-width="8" />

  <!-- Left Dart Horn -->
  <path d="M 195 215 C 160 180 110 160 85 110 C 120 135 165 170 210 205 Z" fill="url(#gold-grad)" filter="url(#glow)" />
  <!-- Left Dart Flights -->
  <polygon points="75,95 85,110 65,115" fill="#ef4444" />

  <!-- Right Dart Horn -->
  <path d="M 317 215 C 352 180 402 160 427 110 C 392 135 347 170 302 205 Z" fill="url(#gold-grad)" filter="url(#glow)" />
  <!-- Right Dart Flights -->
  <polygon points="437,95 427,110 447,115" fill="#ef4444" />

  <!-- Glowing Bullseye Center on Forehead -->
  <circle cx="256" cy="260" r="28" fill="#16a34a" stroke="#ffffff" stroke-width="4" />
  <circle cx="256" cy="260" r="12" fill="#dc2626" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />

  <!-- Snout Ring (Brass Darts Ring) -->
  <circle cx="256" cy="340" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="6" />

  <!-- BullSheet Text Banner Curve -->
  <path d="M 120 440 Q 256 480 392 440" fill="none" stroke="none" id="text-path" />
  <text fill="url(#gold-grad)" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="4">
    <textPath href="#text-path" startOffset="50%" text-anchor="middle">BULLSHEET</textPath>
  </text>
</svg>
